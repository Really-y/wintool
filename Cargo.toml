[package]
name = "wintool"
version = "0.2.2"
edition = "2021"
description = "Menu-driven repair tool for Windows 7-11: automatic network repair, drivers, cleanup, system repair"
authors = ["Yusif Ezizov | AZEDEV"]
license = "CC-BY-NC-SA-4.0"
homepage = "https://azedev.com"
repository = "https://github.com/Really-y/wintool"

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
